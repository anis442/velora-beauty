<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Velra Beauty | Admin Panel</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #fff5f7;
      color: #333;
    }

    .container {
      max-width: 600px;
      margin: 30px auto;
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 5px 25px #00000012;
    }

    h1 {
      text-align: center;
      color: #a52a60;
    }

    h2 {
      margin-top: 25px;
      color: #a52a60;
    }

    input, button {
      width: 100%;
      padding: 13px;
      margin: 8px 0;
      border-radius: 8px;
      font-size: 16px;
    }

    input {
      border: 1px solid #ddd;
    }

    button {
      border: none;
      background: #a52a60;
      color: white;
      cursor: pointer;
    }

    button:hover {
      background: #7e1945;
    }

    #dashboard {
      display: none;
    }

    #message {
      overflow-wrap: anywhere;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>VELRA BEAUTY</h1>
    <h2>Admin Login</h2>

    <form id="loginForm">
      <input
        type="email"
        id="email"
        placeholder="Admin Email"
        autocomplete="username"
        required
      >

      <input
        type="password"
        id="password"
        placeholder="Password"
        autocomplete="current-password"
        required
      >

      <button type="submit">Login</button>
    </form>

    <p id="message" role="status"></p>

    <section id="dashboard">
      <h2>Add New Product</h2>

      <form id="productForm">
        <input
          type="text"
          id="productName"
          placeholder="Product Name"
          required
        >

        <input
          type="number"
          id="productPrice"
          placeholder="Product Price"
          min="0"
          step="0.01"
          required
        >

        <input
          type="url"
          id="productImage"
          placeholder="Product Image URL"
          required
        >

        <button type="submit">Save Product</button>
      </form>

      <button id="logoutButton" type="button">Logout</button>
    </section>
  </div>

  <script type="module">
    import { createClient } from
      "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

    // ধাপ ৩-এ Supabase-এর তথ্য এখানে বসবে।
    const SUPABASE_URL = "https://kdvamcaecahocfhbjbyv.supabase.co";
    const SUPABASE_KEY = "sb_publishable_IVaPMc_xmq5WVgFyrUx7_g_MqUih8X8";

    const message = document.getElementById("message");
    const loginForm = document.getElementById("loginForm");
    const dashboard = document.getElementById("dashboard");
    const productForm = document.getElementById("productForm");

    if (
      SUPABASE_URL.startsWith("YOUR_") ||
      SUPABASE_KEY.startsWith("YOUR_")
    ) {
      message.textContent =
        "Supabase connection setup is required before login.";
    } else {
      const supabase = createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );

      async function updateLoginState() {
        const { data, error } = await supabase.auth.getSession();

        if (error) {
          message.textContent = error.message;
          return;
        }

        const session = data.session;

        loginForm.style.display = session ? "none" : "block";
        dashboard.style.display = session ? "block" : "none";
        message.textContent = session
          ? "You are logged in."
          : "Please log in.";
      }

      loginForm.addEventListener("submit", async (event) => {
        event.preventDefault();

        message.textContent = "Logging in...";

        const { error } = await supabase.auth.signInWithPassword({
          email: document.getElementById("email").value.trim(),
          password: document.getElementById("password").value
        });

        if (error) {
          message.textContent = error.message;
          return;
        }

        await updateLoginState();
      });

      productForm.addEventListener("submit", async (event) => {
        event.preventDefault();

        const { data: userData, error: userError } =
          await supabase.auth.getUser();

        if (userError || !userData.user) {
          message.textContent = "Please log in again.";
          return;
        }

        const product = {
          name: document.getElementById("productName").value.trim(),
          price: Number(document.getElementById("productPrice").value),
          image_url: document.getElementById("productImage").value.trim()
        };

        if (
          !product.name ||
          !Number.isFinite(product.price) ||
          product.price < 0 ||
          !product.image_url
        ) {
          message.textContent = "Please enter valid product details.";
          return;
        }

        const { error } = await supabase
          .from("products")
          .insert(product);

        if (error) {
          message.textContent = "Save failed: " + error.message;
          return;
        }

        message.textContent = "Product saved successfully!";
        productForm.reset();
      });

      document.getElementById("logoutButton")
        .addEventListener("click", async () => {
          const { error } = await supabase.auth.signOut();

          if (error) {
            message.textContent = error.message;
            return;
          }

          await updateLoginState();
        });

      updateLoginState();
    }
  </script>
</body>
</html>
